services:

  # ============================================================
  # MySQL
  # ============================================================
  mysql:
    image: mysql:8.0

    container_name: portfolio-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
      MYSQL_DATABASE: portfolio_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${PORTFOLIO_DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # Portfolio Service
  # ============================================================
  portfolio-service:

    build:
      # IMPORTANT:
      # Root project directory is the build context
      # so Docker can access common-library
      context: .
      dockerfile: ./portfolio-service/Dockerfile

    container_name: portfolio-service

    ports:
      - "${PORTFOLIO_SERVER_PORT}:8082"


    environment:

      # --------------------------------------------------------
      # Server
      # --------------------------------------------------------
      PORTFOLIO_SERVER_PORT: ${PORTFOLIO_SERVER_PORT}


      # --------------------------------------------------------
      # Eureka
      # --------------------------------------------------------
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}


      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------
      PORTFOLIO_DB_URL: ${PORTFOLIO_DB_URL}
      PORTFOLIO_DB_USERNAME: ${PORTFOLIO_DB_USERNAME}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD}


      # --------------------------------------------------------
      # JWT
      # --------------------------------------------------------
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}


      # --------------------------------------------------------
      # Cloudinary
      # --------------------------------------------------------
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}


      # --------------------------------------------------------
      # Brevo Email API
      # --------------------------------------------------------
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}


      # --------------------------------------------------------
      # Portfolio Owner
      # --------------------------------------------------------
      PORTFOLIO_OWNER_EMAIL: ${PORTFOLIO_OWNER_EMAIL}


    depends_on:
      mysql:
        condition: service_healthy


# ==============================================================
# Volumes
# ==============================================================
volumes:

  mysql-data: