# ===============================
# Application
# ===============================
spring.application.name=auth-service
server.port=${AUTH_SERVER_PORT:8081}

eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost

springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# MySQL
# ===============================
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${AUTH_DB_USERNAME:root}
spring.datasource.password=${AUTH_DB_PASSWORD:root}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUU2lnbmluZ0FuZEl0TXVzdEJlTG9uZ0Vub3VnaA==}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:90000000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=*

# ===============================
# Logging
# ===============================
logging.level.org.hibernate.SQL=DEBUG