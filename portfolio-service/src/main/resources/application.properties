spring.application.name=portfolio-service

server.port=${PORT:8082}


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${PORTFOLIO_DB_URL}
spring.datasource.username=${PORTFOLIO_DB_USERNAME}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:90000000}

jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}


# =========================================================
# MAIL
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# CLOUDINARY
# =========================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# PORTFOLIO
# =========================================================

portfolio.owner.email=${PORTFOLIO_OWNER_EMAIL}


# =========================================================
# SWAGGER
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized