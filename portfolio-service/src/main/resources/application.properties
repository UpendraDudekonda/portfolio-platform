# ===============================
# Application
# ===============================
spring.application.name=portfolio-service

server.port=${PORTFOLIO_SERVER_PORT:8082}

# ===============================
# Eureka Configuration
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost
# ===============================
# MySQL
# ===============================
spring.datasource.url=${PORTFOLIO_DB_URL:jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${PORTFOLIO_DB_USERNAME:root}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD:root}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Feign Logging
# ===============================
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.feign=DEBUG

# ===============================
# Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha