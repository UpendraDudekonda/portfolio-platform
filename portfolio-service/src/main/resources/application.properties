spring.application.name=portfolio-service

server.port=${PORT:${PORTFOLIO_SERVER_PORT:8082}}
server.address=0.0.0.0

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${PORTFOLIO_DB_URL}
spring.datasource.username=${PORTFOLIO_DB_USERNAME}
spring.datasource.password=${PORTFOLIO_DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:90000000}

jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}




# =========================================================
# BREVO EMAIL API
# =========================================================

brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Upendra Dudekonda}


# =========================================================
# CLOUDINARY
# =========================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# PORTFOLIO
# =========================================================

portfolio.owner.email=${PORTFOLIO_OWNER_EMAIL}


# =========================================================
# SWAGGER
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info
#management.endpoint.health.show-details=when_authorized